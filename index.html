<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיטת הכוכבים</title>
<style>
  :root {
    --bg: #fbf8ff;
    --ink: #2b2540;
    --muted: #6d6685;
    --accent: #5b3fd1;
    --ok: #1f9d55;
    --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    padding: 20px 24px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.6rem; }
  .version { font-size: .85rem; opacity: .8; direction: ltr; }
  main { max-width: 560px; margin: 32px auto; padding: 0 20px; }
  .card {
    background: #fff;
    border: 1px solid #e3dcf5;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status { font-size: 1.1rem; font-weight: 600; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  button {
    font: inherit;
    padding: 10px 20px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #b7a6f5; outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>שיטת הכוכבים</h1>
  <span class="version" id="version"></span>
</header>

<main>
  <div class="card">
    <p>בדיקת חיבור לענן</p>
    <p class="status" id="status">בודק חיבור...</p>
    <button id="retry" type="button">בדיקה חוזרת</button>
  </div>
  <p class="hint">זה מסך בדיקה זמני. אחרי שהוא מציג "החיבור תקין", ממשיכים לשלב הבא.</p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const APP_VERSION = "0.1.0";
  document.getElementById("version").textContent = "גרסה " + APP_VERSION;

  const firebaseConfig = {
    apiKey: "AIzaSyBtvS1XsCzq5M8bwEMAp-zmO5-eCBuIDEo",
    authDomain: "school-stars-5efd8.firebaseapp.com",
    projectId: "school-stars-5efd8",
    storageBucket: "school-stars-5efd8.firebasestorage.app",
    messagingSenderId: "944955455671",
    appId: "1:944955455671:web:3b2cf362ca6fb6a9f9f532"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const statusEl = document.getElementById("status");

  async function checkConnection() {
    statusEl.className = "status";
    statusEl.textContent = "בודק חיבור...";
    try {
      const ref = doc(db, "healthcheck", "ping");
      await setDoc(ref, { version: APP_VERSION, at: serverTimestamp() });
      const snap = await getDoc(ref);
      if (!snap.exists()) throw new Error("המסמך לא נמצא");
      statusEl.className = "status ok";
      statusEl.textContent = "החיבור תקין. הנתונים נשמרים בענן.";
    } catch (err) {
      statusEl.className = "status bad";
      statusEl.textContent = "החיבור נכשל: " + err.message;
      console.error(err);
    }
  }

  document.getElementById("retry").addEventListener("click", checkConnection);
  checkConnection();
</script>
</body>
</html>
